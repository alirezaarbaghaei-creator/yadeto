  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#020617,#1e1b4b,#0f172a);font-family:Vazirmatn,sans-serif;direction:rtl;">
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border-radius:9999px;border:2.5px solid transparent;border-top-color:#2dd4bf;border-right-color:#818cf8;animation:yadetoSpin 1.4s linear infinite;"></div>
          <img src="/logo.png" alt="Yadeto" style="width:62px;height:62px;border-radius:16px;object-fit:cover;background:#fff;box-shadow:0 12px 30px rgba(99,102,241,0.45);" />
        </div>
        <div style="margin-top:18px;font-size:22px;font-weight:900;color:#fff;letter-spacing:-0.5px;">یادتو</div>
        <div style="margin-top:6px;font-size:12px;color:#cbd5e1;">در حال بارگذاری...</div>
      </div>
      <style>@keyframes yadetoSpin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function (event) {
        console.error('[SmartCalendar] runtime error', event.error || event.message);
      });
      window.addEventListener('unhandledrejection', function (event) {
        console.error('[SmartCalendar] unhandled rejection', event.reason);
      });

      // Service Worker only for web/PWA — disabled in Android WebView/APK
      (function () {
        var isWeb = !window.matchMedia('(display-mode: standalone)').matches
          && window.location.protocol.startsWith('http')
          && !window.AndroidBridge;
        if (isWeb && 'serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        }
      })();
    </script>
  </body>
</html>
